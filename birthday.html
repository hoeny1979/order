<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>생년월일 요일 계산기</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #14532d 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      background: #fff;
      border-radius: 28px;
      padding: 44px 36px 36px;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 28px 72px rgba(0,0,0,.4);
    }

    /* ── Header ── */
    .header { text-align: center; margin-bottom: 36px; }
    .header-icon { font-size: 54px; margin-bottom: 14px; display: block; }
    .header h1 { font-size: 26px; font-weight: 900; color: #1e293b; margin-bottom: 6px; }
    .header p  { font-size: 14px; color: #94a3b8; }

    /* ── Date Inputs ── */
    .date-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 28px;
      justify-content: center;
    }

    .date-field {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .date-field label {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: .5px;
      text-transform: uppercase;
    }
    .date-field input {
      border: 2.5px solid #e2e8f0;
      border-radius: 14px;
      text-align: center;
      font-size: 26px;
      font-weight: 900;
      font-family: inherit;
      color: #1e293b;
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
      background: #f8fafc;
      -moz-appearance: textfield;
    }
    .date-field input::-webkit-outer-spin-button,
    .date-field input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .date-field input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37,99,235,.12);
      background: #fff;
    }
    .date-field input.filled {
      border-color: #22c55e;
      background: #f0fdf4;
    }
    .date-field input.error {
      border-color: #ef4444;
      background: #fef2f2;
      animation: shake .3s ease;
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(-6px); }
      75%      { transform: translateX(6px); }
    }

    #inp-year  { width: 120px; padding: 12px 8px; }
    #inp-month { width: 72px;  padding: 12px 6px; }
    #inp-day   { width: 72px;  padding: 12px 6px; }

    .sep { font-size: 28px; font-weight: 900; color: #cbd5e1; padding-top: 18px; }

    /* ── Keypad ── */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .key {
      background: #f1f5f9;
      border: none;
      border-radius: 12px;
      padding: 16px 8px;
      font-size: 20px;
      font-weight: 700;
      font-family: inherit;
      color: #1e293b;
      cursor: pointer;
      transition: background .15s, transform .1s;
      user-select: none;
    }
    .key:active { background: #e2e8f0; transform: scale(.95); }
    .key.key-del {
      background: #fee2e2;
      color: #dc2626;
      font-size: 18px;
    }
    .key.key-del:active { background: #fecaca; }
    .key.key-next {
      background: #2563eb;
      color: #fff;
      font-size: 15px;
    }
    .key.key-next:active { background: #1d4ed8; }

    /* ── Progress dots ── */
    .progress {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #e2e8f0;
      transition: background .25s, transform .25s;
    }
    .dot.active    { background: #2563eb; transform: scale(1.3); }
    .dot.completed { background: #22c55e; }

    /* ── Result ── */
    .result {
      display: none;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 20px;
      animation: popIn .4s cubic-bezier(.175,.885,.32,1.275);
    }
    @keyframes popIn {
      from { opacity:0; transform: scale(.9) translateY(8px); }
      to   { opacity:1; transform: scale(1) translateY(0); }
    }

    .result-top {
      padding: 30px 24px 24px;
      text-align: center;
      color: #fff;
    }
    .result-emoji { font-size: 60px; margin-bottom: 10px; display: block; }
    .result-day   { font-size: 40px; font-weight: 900; letter-spacing: -1px; margin-bottom: 4px; }
    .result-meaning { font-size: 14px; opacity: .85; }

    .result-bottom {
      background: #f8fafc;
      padding: 18px 20px;
    }
    .info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px solid #e2e8f0;
      font-size: 14px;
    }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: #94a3b8; font-weight: 500; }
    .info-value { color: #1e293b; font-weight: 700; }

    .fun-fact {
      background: #eff6ff;
      border: 1.5px solid #bfdbfe;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 13px;
      color: #1d4ed8;
      line-height: 1.75;
      margin-bottom: 16px;
      display: none;
    }

    .btn-reset {
      width: 100%;
      background: #f1f5f9;
      color: #475569;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px; font-weight: 700; font-family: inherit;
      cursor: pointer;
      display: none;
      transition: background .2s;
    }
    .btn-reset:hover { background: #e2e8f0; }

    /* ── Placeholder ── */
    .hint {
      text-align: center;
      padding: 8px 0 20px;
      color: #cbd5e1;
      font-size: 13px;
    }

    @media (max-width: 400px) {
      .card { padding: 32px 16px 24px; }
      #inp-year  { width: 100px; font-size: 22px; }
      #inp-month, #inp-day { width: 62px; font-size: 22px; }
    }
  </style>
</head>
<body>
<div class="card">

  <!-- Header -->
  <div class="header">
    <span class="header-icon">🗓️</span>
    <h1>생년월일 요일 계산기</h1>
    <p>숫자를 누르면 자동으로 다음 칸으로 넘어갑니다</p>
  </div>

  <!-- Date Display -->
  <div class="date-row">
    <div class="date-field">
      <label>년도</label>
      <input id="inp-year"  type="text" inputmode="numeric" maxlength="4" placeholder="1990" readonly />
    </div>
    <span class="sep">.</span>
    <div class="date-field">
      <label>월</label>
      <input id="inp-month" type="text" inputmode="numeric" maxlength="2" placeholder="01" readonly />
    </div>
    <span class="sep">.</span>
    <div class="date-field">
      <label>일</label>
      <input id="inp-day"   type="text" inputmode="numeric" maxlength="2" placeholder="01" readonly />
    </div>
  </div>

  <!-- Progress -->
  <div class="progress">
    <div class="dot active" id="dot-0"></div>
    <div class="dot" id="dot-1"></div>
    <div class="dot" id="dot-2"></div>
  </div>

  <!-- Hint -->
  <div class="hint" id="hint">년도 4자리를 먼저 입력하세요</div>

  <!-- Result -->
  <div class="result"   id="result">
    <div class="result-top" id="result-top">
      <span class="result-emoji" id="result-emoji"></span>
      <div class="result-day"    id="result-day"></div>
      <div class="result-meaning" id="result-meaning"></div>
    </div>
    <div class="result-bottom">
      <div class="info-row"><span class="info-label">생년월일</span><span class="info-value" id="info-date"></span></div>
      <div class="info-row"><span class="info-label">태어난 요일</span><span class="info-value" id="info-day"></span></div>
      <div class="info-row"><span class="info-label">나이</span><span class="info-value" id="info-age"></span></div>
      <div class="info-row"><span class="info-label">살아온 날</span><span class="info-value" id="info-days"></span></div>
    </div>
  </div>
  <div class="fun-fact" id="fun-fact"></div>
  <button class="btn-reset" id="btn-reset" onclick="doReset()">↩ 다시 입력하기</button>

  <!-- Keypad -->
  <div class="keypad" id="keypad">
    <button class="key" onclick="press('1')">1</button>
    <button class="key" onclick="press('2')">2</button>
    <button class="key" onclick="press('3')">3</button>
    <button class="key" onclick="press('4')">4</button>
    <button class="key" onclick="press('5')">5</button>
    <button class="key" onclick="press('6')">6</button>
    <button class="key" onclick="press('7')">7</button>
    <button class="key" onclick="press('8')">8</button>
    <button class="key" onclick="press('9')">9</button>
    <button class="key key-del" onclick="pressDelete()">⌫</button>
    <button class="key" onclick="press('0')">0</button>
    <button class="key key-next" id="key-next" onclick="pressNext()">다음 →</button>
  </div>

</div>

<script>
  /* ── Day Data ── */
  var DAY_DATA = [
    { name:"일요일", emoji:"☀️", meaning:"태양의 날 (日曜日)", gradient:"linear-gradient(135deg,#f97316,#ef4444)", fact:"일요일은 태양(Sun)을 상징합니다. 영어 Sunday처럼 밝고 에너지 넘치는 날에 태어나셨네요!" },
    { name:"월요일", emoji:"🌙", meaning:"달의 날 (月曜日)",   gradient:"linear-gradient(135deg,#6366f1,#8b5cf6)", fact:"월요일은 달(Moon)을 상징합니다. 영어 Monday — 감수성이 풍부하고 직관력이 뛰어난 날입니다." },
    { name:"화요일", emoji:"🔥", meaning:"화성의 날 (火曜日)", gradient:"linear-gradient(135deg,#ef4444,#dc2626)", fact:"화요일은 화성(Mars)을 상징합니다. 영어 Tuesday — 열정적이고 행동력 있는 날에 태어나셨네요!" },
    { name:"수요일", emoji:"💧", meaning:"수성의 날 (水曜日)", gradient:"linear-gradient(135deg,#0ea5e9,#2563eb)", fact:"수요일은 수성(Mercury)을 상징합니다. 영어 Wednesday — 소통과 지혜를 상징하는 날입니다." },
    { name:"목요일", emoji:"🌳", meaning:"목성의 날 (木曜日)", gradient:"linear-gradient(135deg,#22c55e,#16a34a)", fact:"목요일은 목성(Jupiter)을 상징합니다. 영어 Thursday — 성장과 행운을 상징하는 날에 태어나셨네요!" },
    { name:"금요일", emoji:"✨", meaning:"금성의 날 (金曜日)", gradient:"linear-gradient(135deg,#eab308,#f59e0b)", fact:"금요일은 금성(Venus)을 상징합니다. 영어 Friday — 아름다움과 사랑을 상징하는 날입니다." },
    { name:"토요일", emoji:"🌍", meaning:"토성의 날 (土曜日)", gradient:"linear-gradient(135deg,#64748b,#475569)", fact:"토요일은 토성(Saturn)을 상징합니다. 영어 Saturday — 안정과 근면을 상징하는 날에 태어나셨네요!" },
  ];

  var HINTS = ["년도 4자리를 먼저 입력하세요", "월을 입력하세요 (1~12)", "일을 입력하세요 (1~31)"];

  /* ── State ── */
  var focus = 0; // 0=year, 1=month, 2=day
  var vals  = ["", "", ""];

  function currentInput() {
    return document.getElementById(["inp-year","inp-month","inp-day"][focus]);
  }

  /* ── Keypad ── */
  function press(digit) {
    var inp = currentInput();
    var max = focus === 0 ? 4 : 2;
    if (vals[focus].length >= max) return;
    vals[focus] += digit;
    inp.value = vals[focus];

    // Auto-advance
    if (vals[focus].length === max) {
      if (focus < 2) {
        setTimeout(function() { advanceFocus(); }, 120);
      } else {
        setTimeout(function() { showResult(); }, 120);
      }
    }
  }

  function pressDelete() {
    if (vals[focus].length > 0) {
      vals[focus] = vals[focus].slice(0, -1);
      currentInput().value = vals[focus];
      currentInput().classList.remove("filled", "error");
    } else if (focus > 0) {
      focus--;
      updateFocus();
    }
    hideResult();
  }

  function pressNext() {
    if (focus < 2) {
      if (vals[focus].length === 0) { shake(); return; }
      advanceFocus();
    } else {
      showResult();
    }
  }

  function advanceFocus() {
    currentInput().classList.add("filled");
    focus++;
    updateFocus();
  }

  function updateFocus() {
    ["inp-year","inp-month","inp-day"].forEach(function(id, i) {
      document.getElementById(id).style.borderColor = "";
    });
    for (var i = 0; i < 3; i++) {
      var dot = document.getElementById("dot-" + i);
      dot.className = "dot" + (i < focus ? " completed" : i === focus ? " active" : "");
    }
    document.getElementById("hint").textContent = HINTS[focus];
    var nextBtn = document.getElementById("key-next");
    nextBtn.textContent = focus === 2 ? "확인 ✓" : "다음 →";
    currentInput().focus();
  }

  /* ── Result ── */
  function showResult() {
    var y = parseInt(vals[0], 10) || 0;
    var m = parseInt(vals[1], 10) || 0;
    var d = parseInt(vals[2], 10) || 0;

    // Validate
    if (y < 1900 || y > new Date().getFullYear()) { shakeField(0); return; }
    if (m < 1 || m > 12)  { shakeField(1); return; }
    var maxDay = new Date(y, m, 0).getDate();
    if (d < 1 || d > maxDay) { shakeField(2); return; }

    var birth = new Date(y, m - 1, d);
    var today = new Date();
    if (birth > today) { shakeField(0); return; }

    var info    = DAY_DATA[birth.getDay()];
    var age     = today.getFullYear() - y - (today < new Date(today.getFullYear(), m - 1, d) ? 1 : 0);
    var liveDays = Math.floor((today - birth) / 86400000);

    document.getElementById("result-top").style.background = info.gradient;
    document.getElementById("result-emoji").textContent    = info.emoji;
    document.getElementById("result-day").textContent      = info.name;
    document.getElementById("result-meaning").textContent  = info.meaning;
    document.getElementById("info-date").textContent = y + "년 " + m + "월 " + d + "일";
    document.getElementById("info-day").textContent  = info.name;
    document.getElementById("info-age").textContent  = "만 " + age + "세";
    document.getElementById("info-days").textContent = liveDays.toLocaleString() + "일째";
    document.getElementById("fun-fact").textContent  = "💡 " + info.fact;

    document.getElementById("result").style.display   = "block";
    document.getElementById("fun-fact").style.display = "block";
    document.getElementById("btn-reset").style.display = "block";
    document.getElementById("hint").style.display     = "none";
    document.getElementById("keypad").style.display   = "none";

    // Mark all filled
    ["inp-year","inp-month","inp-day"].forEach(function(id) {
      document.getElementById(id).classList.add("filled");
    });
  }

  function hideResult() {
    document.getElementById("result").style.display    = "none";
    document.getElementById("fun-fact").style.display  = "none";
    document.getElementById("btn-reset").style.display = "none";
    document.getElementById("hint").style.display      = "block";
  }

  function doReset() {
    vals  = ["", "", ""];
    focus = 0;
    ["inp-year","inp-month","inp-day"].forEach(function(id) {
      var el = document.getElementById(id);
      el.value = "";
      el.className = "";
    });
    hideResult();
    document.getElementById("keypad").style.display = "grid";
    updateFocus();
  }

  function shakeField(idx) {
    var ids = ["inp-year","inp-month","inp-day"];
    var el  = document.getElementById(ids[idx]);
    el.classList.remove("error");
    void el.offsetWidth;
    el.classList.add("error");
    setTimeout(function() { el.classList.remove("error"); }, 400);
    focus = idx;
    updateFocus();
  }

  function shake() {
    var el = currentInput();
    el.classList.remove("error");
    void el.offsetWidth;
    el.classList.add("error");
    setTimeout(function() { el.classList.remove("error"); }, 400);
  }

  /* ── Keyboard support ── */
  document.addEventListener("keydown", function(e) {
    if (document.getElementById("keypad").style.display === "none") return;
    if (e.key >= "0" && e.key <= "9") press(e.key);
    else if (e.key === "Backspace") pressDelete();
    else if (e.key === "Enter" || e.key === "ArrowRight") pressNext();
  });

  /* ── Init ── */
  updateFocus();
</script>
</body>
</html>
